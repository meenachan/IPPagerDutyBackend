spring:
  application:
    name: ipDeadlineTracker

  datasource:
    # For Supabase, set DB_HOST to your project's connection host (or the
    # pooler host, e.g. aws-0-<region>.pooler.supabase.com with DB_PORT=6543
    # and DB_USER=postgres.<project-ref>), DB_NAME=postgres, and DB_PASSWORD
    # to your database password from Supabase project settings.
    #
    # prepareThreshold=0 disables pgjdbc server-side prepared statements,
    # which is REQUIRED when connecting through Supabase's pooler (port 6543,
    # PgBouncer in transaction mode) — server-side prepared statements are
    # not supported across pooled connections and cause
    # "prepared statement already exists" errors otherwise. Safe to leave on
    # for direct (port 5432) connections too.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipdeadline}?sslmode=${DB_SSLMODE:prefer}&prepareThreshold=0
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    # Defaults target Gmail SMTP (smtp.gmail.com:587 with STARTTLS). For local
    # dev without real email, point MAIL_HOST at a fake SMTP server (e.g.
    # MailHog on localhost:1025) and leave auth/starttls disabled via env.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # MAIL_USER must be a full Gmail address; MAIL_PASSWORD must be a Google
    # App Password (not your regular account password) — see
    # https://myaccount.google.com/apppasswords. Requires 2-Step Verification.
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

app:
  magic-link:
    expiry-minutes: 15
  session:
    cookie-name: ipd_session
    expiry-days: 7
    # Must be false for local http://localhost dev (browsers reject Secure
    # cookies over plain http); true in any real (https) deployment.
    cookie-secure: ${COOKIE_SECURE:true}
    # Use "None" (requires cookie-secure=true) when the Angular frontend and
    # this backend are deployed on different sites/domains. "Lax" is fine
    # when they share the same site (e.g. same registrable domain).
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  reminders:
    offsets-days: 30,7,2,1
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
    callback-path: /auth/callback
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
